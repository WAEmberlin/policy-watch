<script src="a11y.js"></script>
<script src="data-config.js"></script>
<script src="data-url.js"></script>
<script src="shell.js"></script>
<script src="stream-utils.js"></script>
<script>
CivicWatchShell.init({
    page: 'hearings',
    stateChips: [
        { select: 'upcoming-state-filter', chips: 'upcoming-state-chips' },
        { select: 'historical-state-filter', chips: 'historical-state-chips' },
    ],
});

// Store original data
let allUpcomingHearings = [];
let allHistoricalHearings = [];
let kansasCalendarsByDate = {}; // { "2025-01-13": [ { chamber, title, link }, ... ] }

const HEARING_DATE_KEY_LABELS = {
    "on-call": "On Call — No Scheduled Date",
    unknown: "Date To Be Determined",
};

function hearingDateKey(hearing) {
    const scheduled = (hearing.scheduled_date || "").trim();
    if (!scheduled) {
        return hearing.interim_placeholder ? "on-call" : "unknown";
    }
    return scheduled.split("T")[0];
}

function formatDate(dateStr) {
    if (!dateStr || HEARING_DATE_KEY_LABELS[dateStr]) {
        return HEARING_DATE_KEY_LABELS[dateStr] || "Date To Be Determined";
    }
    try {
        const date = new Date(dateStr + "T00:00:00");
        if (isNaN(date.getTime())) {
            return dateStr;
        }
        return date.toLocaleDateString("en-US", {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric",
            timeZone: "America/Chicago"
        });
    } catch {
        return dateStr;
    }
}

function getYearFromDate(dateStr) {
    try {
        if (!dateStr || HEARING_DATE_KEY_LABELS[dateStr]) return "";
        const dateKey = dateStr.split("T")[0];
        const date = new Date(dateKey + "T00:00:00");
        if (isNaN(date.getTime())) return "";
        return date.getFullYear().toString();
    } catch {
        return "";
    }
}

const STATE_LABELS = { KS: "Kansas", CO: "Colorado", AZ: "Arizona", UT: "Utah", ME: "Maine", NE: "Nebraska", MD: "Maryland", PA: "Pennsylvania", Federal: "Federal" };
const STATE_BADGE_COLORS = {
    KS: "bg-emerald-500",
    CO: "bg-sky-500",
    AZ: "bg-orange-500",
    UT: "bg-violet-500",
    ME: "bg-teal-600",
    NE: "bg-amber-600",
    MD: "bg-teal-500",
    Federal: "bg-civic-blue",
};

function inferHearingState(hearing) {
    if (hearing.state) return hearing.state;
    if (hearing.level === "federal") return "Federal";
    const source = (hearing.source || "").toLowerCase();
    if (source.includes("federal") || source.includes("congress")) return "Federal";
    if (source.includes("kansas")) return "KS";
    if (source.includes("colorado")) return "CO";
    if (source.includes("arizona")) return "AZ";
    if (source.includes("utah")) return "UT";
    if (source.includes("maine")) return "ME";
    if (source.includes("nebraska")) return "NE";
    if (source.includes("maryland")) return "MD";
    return "";
}

function filterHearings(hearings, stateFilter, yearFilter, committeeFilter) {
    return hearings.filter(hearing => {
        // Filter by state
        if (stateFilter) {
            const hearingState = inferHearingState(hearing);
            if (hearingState !== stateFilter) return false;
        }
        
        // Filter by year
        if (yearFilter) {
            const year = getYearFromDate(hearingDateKey(hearing));
            if (year !== yearFilter) {
                return false;
            }
        }
        
        // Filter by committee (House/Senate committee name)
        if (committeeFilter) {
            const committee = (hearing.committee || "").trim();
            const committees = (hearing.committees || "").trim();
            // Match single committee field or any committee in comma-separated committees
            const committeeList = committees ? committees.split(",").map(s => s.trim()).filter(Boolean) : [];
            const allCommittees = committee ? [committee, ...committeeList] : committeeList;
            const match = allCommittees.some(c => c === committeeFilter);
            if (!match) return false;
        }
        
        return true;
    });
}

function populateYearFilters(hearings, filterId) {
    const yearFilter = document.getElementById(filterId);
    const years = new Set();
    
    hearings.forEach(hearing => {
        const year = getYearFromDate(hearingDateKey(hearing));
        if (year) {
            years.add(year);
        }
    });
    
    // Clear existing options except "All Years"
    yearFilter.innerHTML = '<option value="">All Years</option>';
    
    // Add year options sorted descending (newest first)
    Array.from(years).sort((a, b) => b.localeCompare(a)).forEach(year => {
        const option = document.createElement("option");
        option.value = year;
        option.textContent = year;
        yearFilter.appendChild(option);
    });
}

function populateCommitteeFilters(hearings, filterId) {
    const committeeFilter = document.getElementById(filterId);
    const committees = new Set();
    
    hearings.forEach(hearing => {
        const committee = (hearing.committee || "").trim();
        const committeesStr = (hearing.committees || "").trim();
        if (committee) committees.add(committee);
        if (committeesStr) {
            committeesStr.split(",").forEach(s => {
                const c = s.trim();
                if (c) committees.add(c);
            });
        }
    });
    
    // Clear existing options except "All Committees"
    committeeFilter.innerHTML = '<option value="">All Committees</option>';
    
    // Add committee options sorted alphabetically (House first, then Senate, then other)
    const sorted = Array.from(committees).sort((a, b) => {
        const aHouse = a.toUpperCase().startsWith("HOUSE") ? 0 : a.toUpperCase().startsWith("SENATE") ? 1 : 2;
        const bHouse = b.toUpperCase().startsWith("HOUSE") ? 0 : b.toUpperCase().startsWith("SENATE") ? 1 : 2;
        if (aHouse !== bHouse) return aHouse - bHouse;
        return a.localeCompare(b);
    });
    
    sorted.forEach(committee => {
        const option = document.createElement("option");
        option.value = committee;
        option.textContent = committee;
        committeeFilter.appendChild(option);
    });
}

function renderHearings(hearings, container, emptyMessage, stateFilter = "", yearFilter = "", committeeFilter = "") {
    const filtered = filterHearings(hearings, stateFilter, yearFilter, committeeFilter);
    
    if (filtered.length === 0) {
        container.innerHTML = `
            <div class="text-center py-12">
                <svg class="w-16 h-16 mx-auto mb-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
                <p class="text-slate-500 font-medium">${emptyMessage}</p>
                ${(stateFilter || yearFilter || committeeFilter) ? '<p class="text-slate-400 text-sm mt-1">Try adjusting your filters.</p>' : '<p class="text-slate-400 text-sm mt-1">Open States hearings appear after the daily sync runs with OPENSTATES_API_KEY set.</p>'}
            </div>
        `;
        return;
    }
    
    container.innerHTML = "";
    
    // Group hearings by date
    const groupedByDate = {};
    filtered.forEach(hearing => {
        const dateKey = hearingDateKey(hearing);
        if (!groupedByDate[dateKey]) {
            groupedByDate[dateKey] = [];
        }
        groupedByDate[dateKey].push(hearing);
    });
    
    // Sort dates - for historical, reverse to show newest first
    const isHistorical = container.id === "historical-hearings-container";
    const dates = Object.keys(groupedByDate).sort();
    if (isHistorical) {
        dates.reverse(); // Most recent dates first for historical
    }
    
    dates.forEach(dateKey => {
        const dateSection = document.createElement("div");
        dateSection.className = "mb-8";
        
        const dateHeader = document.createElement("h3");
        dateHeader.className = "text-lg font-bold text-civic-navy mb-4 flex items-center gap-2";
        dateHeader.innerHTML = `
            <svg class="w-5 h-5 text-civic-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            ${formatDate(dateKey)}
        `;
        dateSection.appendChild(dateHeader);
        
        // Kansas Legislature calendar links for this date (House/Senate calendar pages)
        const calendarsForDate = kansasCalendarsByDate[dateKey] || [];
        if (calendarsForDate.length > 0) {
            const calRow = document.createElement("div");
            calRow.className = "mb-4 flex flex-wrap gap-3";
            calendarsForDate.forEach(cal => {
                const a = document.createElement("a");
                a.href = cal.link;
                a.target = "_blank";
                a.rel = "noopener noreferrer";
                a.className = "inline-flex items-center gap-2 px-4 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 rounded-lg border border-emerald-200 font-medium text-sm transition-colors";
                a.innerHTML = `
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                    ${cal.chamber} Calendar
                `;
                calRow.appendChild(a);
            });
            dateSection.appendChild(calRow);
        }
        
        const hearingsForDate = groupedByDate[dateKey];
        
        hearingsForDate.forEach(hearing => {
            const card = document.createElement("div");
            const title = hearing.title || "Conference Committee Hearing";
            const isCanceled = title.toUpperCase().includes("CANCELED") || title.toUpperCase().includes("MEETING CANCELED");
            
            card.className = `hearing-card mb-4 p-5 rounded-xl border-l-4 shadow-sm transition-all ${
                isCanceled 
                    ? 'bg-red-50 border-red-400 opacity-75' 
                    : 'bg-gradient-to-r from-slate-50 to-white border-civic-blue hover:shadow-md'
            }`;
            
            // Show time next to title
            const titleWithTime = hearing.scheduled_time 
                ? `${title} - ${hearing.scheduled_time}`
                : title;
            
            // Show state badge
            const hearingState = inferHearingState(hearing);
            const source = hearing.source || (hearingState ? `${STATE_LABELS[hearingState] || hearingState}` : "Unknown");
            const badgeClass = STATE_BADGE_COLORS[hearingState] || "bg-slate-500";
            const badgeLabel = hearingState === "Federal" ? "Federal (US Congress)" : `State (${STATE_LABELS[hearingState] || hearingState})`;

            const streamInfo = window.CivicWatchStreamUtils
                ? CivicWatchStreamUtils.resolveHearingStream(hearing)
                : null;
            const streamHtml = streamInfo
                ? CivicWatchStreamUtils.renderStreamActions(streamInfo, { compact: true, hearingTitle: titleWithTime })
                : "";
            
            card.innerHTML = `
                <div class="mb-3">
                    <span class="inline-block px-3 py-1 ${badgeClass} text-white rounded-full text-xs font-semibold uppercase tracking-wide mb-2">
                        ${badgeLabel}
                    </span>
                    <h4 class="text-lg font-semibold ${isCanceled ? 'text-red-600 line-through' : 'text-civic-navy'}">
                        ${titleWithTime}
                    </h4>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-3">
                    ${hearing.location ? `
                    <div>
                        <span class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Location</span>
                        <span class="text-slate-700">${hearing.location}</span>
                    </div>
                    ` : ''}
                    ${hearing.bill ? `
                    <div>
                        <span class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Bill</span>
                        <span class="text-civic-blue font-semibold">${hearing.bill}</span>
                    </div>
                    ` : ''}
                    ${(hearing.committees || hearing.committee) ? `
                    <div class="sm:col-span-2 lg:col-span-1">
                        <span class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">${hearing.chamber ? hearing.chamber + ' ' : ''}Committee${hearing.committees && hearing.committees.includes(',') ? 's' : ''}</span>
                        <span class="text-slate-700">${hearing.committees || hearing.committee}</span>
                    </div>
                    ` : ''}
                </div>
                
                ${(hearing.link || hearing.url) ? `
                <a href="${hearing.link || hearing.url}" target="_blank" rel="noopener noreferrer" 
                   class="inline-flex items-center gap-1 text-civic-blue hover:text-civic-blue-dark font-medium text-sm transition-colors">
                    ${hearing.source && hearing.source.includes("Federal") ? "View on Congress.gov" : hearing.url ? "View details" : "View Full Schedule"}
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                    </svg>
                </a>
                ` : ''}
                ${streamHtml}
                <div class="hearing-embed-slot"></div>
            `;
            
            dateSection.appendChild(card);
        });
        
        container.appendChild(dateSection);
    });
}

function setupHearingStreamHandlers() {
    document.addEventListener("click", function (e) {
        const playBtn = e.target.closest(".hearing-play-btn");
        if (playBtn) {
            const card = playBtn.closest(".hearing-card");
            const embedUrl = playBtn.getAttribute("data-embed-url");
            if (!card || !embedUrl || !window.CivicWatchStreamUtils) return;
            const slot = card.querySelector(".hearing-embed-slot");
            if (slot) {
                slot.innerHTML = CivicWatchStreamUtils.renderInlinePlayer(embedUrl);
                slot.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
            return;
        }

        const liveBtn = e.target.closest(".hearing-play-livestream-btn");
        if (liveBtn) {
            const streamId = liveBtn.getAttribute("data-livestream-id");
            if (streamId) {
                window.location.href = `livestreams.html#${streamId}`;
            }
        }
    });
}

function syncStateChips(prefix) {
    const select = document.getElementById(prefix + '-state-filter');
    const chips = document.getElementById(prefix + '-state-chips');
    if (!select || !chips) return;
    chips.querySelectorAll('.cw-state-chip').forEach(function (chip) {
        chip.setAttribute('aria-pressed', chip.dataset.state === select.value ? 'true' : 'false');
    });
}

function setupFilters() {
    const upcomingContainer = document.getElementById("upcoming-hearings-container");
    const historicalContainer = document.getElementById("historical-hearings-container");
    
    function applyUpcomingFilters() {
        const stateFilter = document.getElementById("upcoming-state-filter").value;
        const yearFilter = document.getElementById("upcoming-year-filter").value;
        const committeeFilter = document.getElementById("upcoming-committee-filter").value;
        renderHearings(allUpcomingHearings, upcomingContainer, "No upcoming hearings scheduled",
                      stateFilter, yearFilter, committeeFilter);
    }
    
    function applyHistoricalFilters() {
        const stateFilter = document.getElementById("historical-state-filter").value;
        const yearFilter = document.getElementById("historical-year-filter").value;
        const committeeFilter = document.getElementById("historical-committee-filter").value;
        renderHearings(allHistoricalHearings, historicalContainer, "No historical hearings available",
                      stateFilter, yearFilter, committeeFilter);
    }
    
    // Upcoming filters
    document.getElementById("upcoming-state-filter").addEventListener("change", function () {
        syncStateChips('upcoming');
        applyUpcomingFilters();
    });
    document.getElementById("upcoming-year-filter").addEventListener("change", applyUpcomingFilters);
    document.getElementById("upcoming-committee-filter").addEventListener("change", applyUpcomingFilters);
    
    // Historical filters
    document.getElementById("historical-state-filter").addEventListener("change", function () {
        syncStateChips('historical');
        applyHistoricalFilters();
    });
    document.getElementById("historical-year-filter").addEventListener("change", applyHistoricalFilters);
    document.getElementById("historical-committee-filter").addEventListener("change", applyHistoricalFilters);
}

function clearFilters(type) {
    if (type === "upcoming") {
        document.getElementById("upcoming-state-filter").value = "";
        document.getElementById("upcoming-year-filter").value = "";
        document.getElementById("upcoming-committee-filter").value = "";
        syncStateChips('upcoming');
        renderHearings(allUpcomingHearings, document.getElementById("upcoming-hearings-container"), 
                      "No upcoming hearings scheduled", "", "", "");
    } else if (type === "historical") {
        document.getElementById("historical-state-filter").value = "";
        document.getElementById("historical-year-filter").value = "";
        document.getElementById("historical-committee-filter").value = "";
        syncStateChips('historical');
        renderHearings(allHistoricalHearings, document.getElementById("historical-hearings-container"), 
                      "No historical hearings available", "", "", "");
    }
}

async function loadHearings() {
    const upcomingContainer = document.getElementById("upcoming-hearings-container");
    const historicalContainer = document.getElementById("historical-hearings-container");
    
    try {
        const res = await civicwatchFetch("site_data.json");
        const data = await res.json();
        
        allUpcomingHearings = data.upcoming_hearings || [];
        allHistoricalHearings = data.historical_hearings || [];
        kansasCalendarsByDate = data.kansas_calendars || {};
        
        // Populate year and committee filters
        populateYearFilters(allUpcomingHearings, "upcoming-year-filter");
        populateYearFilters(allHistoricalHearings, "historical-year-filter");
        populateCommitteeFilters(allUpcomingHearings, "upcoming-committee-filter");
        populateCommitteeFilters(allHistoricalHearings, "historical-committee-filter");
        
        // Setup filter event listeners
        setupFilters();
        setupHearingStreamHandlers();
        
        // Initial render
        renderHearings(allUpcomingHearings, upcomingContainer, "No upcoming hearings scheduled");
        renderHearings(allHistoricalHearings, historicalContainer, "No historical hearings available");
        
    } catch (error) {
        upcomingContainer.innerHTML = `
            <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded-r-lg">
                <p class="text-red-700 font-semibold">Error loading hearings</p>
                <p class="text-red-600 text-sm mt-1">${error.message}</p>
                <p class="text-red-500 text-sm mt-2">Please try again later.</p>
            </div>
        `;
        historicalContainer.innerHTML = "";
    }
}

window.onload = loadHearings;
</script>
</body>
</html>
