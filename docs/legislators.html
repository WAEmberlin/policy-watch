<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CivicWatch Legislators</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
    theme: {
        extend: {
            colors: {
                civic: { navy: '#001f3f', gold: '#ffc107', blue: '#1a73e8', 'blue-dark': '#1557b0' }
            }
        }
    }
}
</script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100">
<div class="max-w-6xl mx-auto px-4 py-8">
    <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-gradient-to-r from-civic-navy to-slate-800 px-8 py-6">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <h1 class="text-3xl font-bold"><span class="text-white">Civic</span><span class="text-civic-gold">Watch</span> Legislators</h1>
                <div class="flex gap-3">
                    <a href="index.html" class="px-4 py-2 bg-white/10 hover:bg-white/20 text-white rounded-lg text-sm">Main Feed</a>
                    <a href="dashboard.html" class="px-4 py-2 bg-white/10 hover:bg-white/20 text-white rounded-lg text-sm">Dashboards</a>
                </div>
            </div>
        </div>
        <div class="p-6 md:p-8">
            <div class="flex gap-3 mb-6">
                <select id="leg-state-filter" class="px-4 py-2 border-2 border-slate-200 rounded-lg bg-white">
                    <option value="">All States</option>
                </select>
                <input type="text" id="leg-search" placeholder="Search by name..." class="flex-1 px-4 py-2 border-2 border-slate-200 rounded-lg" />
            </div>
            <div id="legislators-list" class="grid gap-4 md:grid-cols-2">
                <p class="text-slate-500 italic col-span-2 text-center py-8">Loading legislators...</p>
            </div>
        </div>
    </div>
</div>
<script src="expansion.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    CivicWatchExpansion.initLegislators();
});
</script>
</body>
</html>
