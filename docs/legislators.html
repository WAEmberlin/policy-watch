<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Legislators — CivicWatch</title>
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="sr-only.css" />
<script src="theme.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
    theme: {
        extend: {
            colors: {
                white: 'var(--cw-white)',
                civic: {
                    navy: 'var(--cw-navy)',
                    gold: 'var(--cw-gold)',
                    blue: 'var(--cw-blue)',
                    'blue-dark': 'var(--cw-blue-dark)',
                },
                slate: {
                    50: 'var(--cw-slate-50)',
                    100: 'var(--cw-slate-100)',
                    200: 'var(--cw-slate-200)',
                    300: 'var(--cw-slate-300)',
                    400: 'var(--cw-slate-400)',
                    500: 'var(--cw-slate-500)',
                    600: 'var(--cw-slate-600)',
                    700: 'var(--cw-slate-700)',
                    800: 'var(--cw-slate-800)',
                }
            }
        }
    }
}
</script>
</head>
<body class="cw-page-bg min-h-screen" data-cw-page="legislators">
<div id="cw-page-wrapper" class="max-w-6xl mx-auto px-4 py-4">
<main id="cw-main-content">
    <div class="cw-card shadow-xl">
        <div class="cw-card-header">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-4">
                    <img src="CivicWatch Logo.png" alt="CivicWatch Logo" class="h-14 w-auto hidden sm:block" />
                    <div>
                        <h1 class="text-3xl font-bold">
                            <span class="text-white">Civic</span><span class="text-civic-gold">Watch</span>
                        </h1>
                        <div class="cw-text-on-header-muted text-sm mt-1">Legislators — All States</div>
                    </div>
                </div>
                <div data-cw-theme-toggle></div>
            </div>
        </div>
        <div class="cw-card-body p-6 md:p-8">
            <div id="leg-tabs" class="cw-tab-row" role="tablist" aria-label="Legislators views">
                <button type="button" id="leg-tab-directory" class="px-4 py-2 bg-civic-blue text-white rounded-lg text-sm font-medium" role="tab" aria-selected="true">Directory</button>
                <button type="button" id="leg-tab-stats" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-medium" role="tab" aria-selected="false">Stats</button>
            </div>
            <div id="leg-directory-panel">
            <div class="flex flex-col sm:flex-row gap-3 mb-6">
                <select id="leg-state-filter" class="w-full sm:w-auto px-4 py-2 border-2 rounded-lg" style="border-color: var(--cw-border); background: var(--cw-surface);">
                    <option value="">All States</option>
                </select>
                <input type="text" id="leg-search" placeholder="Search by name..." class="w-full sm:flex-1 px-4 py-2 border-2 rounded-lg" style="border-color: var(--cw-border); background: var(--cw-surface);" />
            </div>
            <div id="legislators-list" class="grid gap-4 md:grid-cols-2">
                <p class="text-slate-500 italic col-span-2 text-center py-8">Loading legislators...</p>
            </div>
            </div>
            <div id="leg-stats-panel" class="hidden" role="tabpanel" aria-labelledby="leg-tab-stats">
                <div class="flex gap-3 mb-6">
                    <select id="leg-stats-state-filter" class="px-4 py-2 border-2 rounded-lg" style="border-color: var(--cw-border); background: var(--cw-surface);">
                        <option value="">All States</option>
                    </select>
                </div>
                <div id="legislators-stats">
                    <p class="text-slate-500 italic text-center py-8">Loading stats...</p>
                </div>
            </div>
        </div>
    </div>
</main>
</div>
<script src="a11y.js"></script>
<script src="shell.js"></script>
<script src="expansion.js"></script>
<script>
CivicWatchShell.init({ page: 'legislators' });
document.addEventListener('DOMContentLoaded', () => {
    CivicWatchExpansion.initLegislators();
});
</script>
</body>
</html>
