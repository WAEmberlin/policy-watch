<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elections — PolicyWatch</title>
<link rel="stylesheet" href="theme.css?v=ledger6" />
<link rel="stylesheet" href="sr-only.css" />
<script src="theme.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
    theme: {
        extend: {
            colors: {
                white: 'var(--cw-white)',
                civic: {
                    navy: 'var(--cw-navy)',
                    gold: 'var(--cw-gold)',
                    blue: 'var(--cw-blue)',
                    'blue-dark': 'var(--cw-blue-dark)',
                },
                slate: {
                    50: 'var(--cw-slate-50)',
                    100: 'var(--cw-slate-100)',
                    200: 'var(--cw-slate-200)',
                    300: 'var(--cw-slate-300)',
                    400: 'var(--cw-slate-400)',
                    500: 'var(--cw-slate-500)',
                    600: 'var(--cw-slate-600)',
                    700: 'var(--cw-slate-700)',
                    800: 'var(--cw-slate-800)',
                }
            }
        }
    }
}
</script>
</head>
<body class="cw-page-bg min-h-screen" data-cw-page="dashboard">
<div id="cw-page-wrapper" class="max-w-6xl mx-auto px-4 py-4">
<main id="cw-main-content">
    <div class="cw-card shadow-xl">
        <header class="cw-header cw-card-header">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <div class="ledger-brand flex-1 min-w-0">
                    <img src="policywatch-mark.png" alt="" class="ledger-mark" width="56" height="56" />
                    <h1 class="ledger-wordmark">
                        Policy <span class="ledger-wordmark-accent">Watch</span>
                    </h1>
                    <div class="ledger-timestamp">Elections — Dates &amp; Official Results</div>
                </div>
                <div data-cw-theme-toggle></div>
            </div>
        </header>
        <div class="cw-card-body p-6 md:p-8">
            <div id="elections-dashboard">
                <p class="text-slate-500 italic text-center py-8">Loading election information...</p>
            </div>
        </div>
    </div>
</main>
</div>
<script src="a11y.js"></script>
<script src="shell.js"></script>
<script src="elections-dashboard.js"></script>
<script>
PolicyWatchShell.init({ page: 'dashboard' });
document.addEventListener('DOMContentLoaded', () => {
    PolicyWatchElections.init();
});
</script>
</body>
</html>
