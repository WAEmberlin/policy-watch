# Supplemental state data sources (outside Open States)

arizona_cactus:
  base_url: https://api.cactus.watch
  bills_path: /api/bills
  sync_path: /api/bills/sync
  # First run sync window when no prior fetch exists
  initial_sync_days: 30
  page_limit: 200
  request_delay_seconds: 0.5

