name: Email Updates

on:
  schedule:
    # Once daily at 6:00 AM Central during CDT (Mar–Nov): 11:00 UTC
    # During CST (Nov–Mar) this runs at 5:00 AM Central.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      digest:
        description: "Optional digest id (e.g. all_vets). Leave empty to send all."
        required: false
        type: string

permissions:
  contents: read  # Only need read access for email

jobs:
  send-email:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          pip install pyyaml requests beautifulsoup4 feedparser boto3

      - name: Restore Open States bills from R2
        id: restore-bills
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET_NAME" ]; then
            echo "ERROR: R2 secrets are required so email can include Open States bills (MA/MO/IA and other states)." | tee r2-restore-error.txt
            exit 1
          fi
          python src/processing/r2_sync.py download data/normalized/bills.json 2>&1 | tee r2-restore-error.txt
          test -s data/normalized/bills.json

      - name: Send email digests
        env:
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # Legacy fallback — receives "all" digest if EMAIL_DIGEST_RECIPIENTS not set
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Primary: JSON map of digest_id → email addresses (never committed to repo)
          EMAIL_DIGEST_RECIPIENTS: ${{ secrets.EMAIL_DIGEST_RECIPIENTS }}
          # Optional per-digest overrides (comma-separated addresses)
          EMAIL_RECIPIENTS_KS: ${{ secrets.EMAIL_RECIPIENTS_KS }}
          EMAIL_RECIPIENTS_CO: ${{ secrets.EMAIL_RECIPIENTS_CO }}
          EMAIL_RECIPIENTS_AZ: ${{ secrets.EMAIL_RECIPIENTS_AZ }}
          EMAIL_RECIPIENTS_UT: ${{ secrets.EMAIL_RECIPIENTS_UT }}
          EMAIL_RECIPIENTS_ME: ${{ secrets.EMAIL_RECIPIENTS_ME }}
          EMAIL_RECIPIENTS_NE: ${{ secrets.EMAIL_RECIPIENTS_NE }}
          EMAIL_RECIPIENTS_MD: ${{ secrets.EMAIL_RECIPIENTS_MD }}
          EMAIL_RECIPIENTS_PA: ${{ secrets.EMAIL_RECIPIENTS_PA }}
          EMAIL_RECIPIENTS_MA: ${{ secrets.EMAIL_RECIPIENTS_MA }}
          EMAIL_RECIPIENTS_WV: ${{ secrets.EMAIL_RECIPIENTS_WV }}
          EMAIL_RECIPIENTS_TN: ${{ secrets.EMAIL_RECIPIENTS_TN }}
          EMAIL_RECIPIENTS_NC: ${{ secrets.EMAIL_RECIPIENTS_NC }}
          EMAIL_RECIPIENTS_MO: ${{ secrets.EMAIL_RECIPIENTS_MO }}
          EMAIL_RECIPIENTS_IA: ${{ secrets.EMAIL_RECIPIENTS_IA }}
          EMAIL_RECIPIENTS_FEDERAL: ${{ secrets.EMAIL_RECIPIENTS_FEDERAL }}
          EMAIL_RECIPIENTS_ALL: ${{ secrets.EMAIL_RECIPIENTS_ALL }}
          EMAIL_RECIPIENTS_FEDERAL_VETS: ${{ secrets.EMAIL_RECIPIENTS_FEDERAL_VETS }}
          EMAIL_RECIPIENTS_ALL_VETS: ${{ secrets.EMAIL_RECIPIENTS_ALL_VETS }}
        run: |
          if [ -z "$EMAIL_HOST" ] || [ -z "$EMAIL_USER" ] || [ -z "$EMAIL_PASS" ]; then
            echo "ERROR: Missing SMTP secrets (EMAIL_HOST, EMAIL_USER, EMAIL_PASS)"
            exit 1
          fi
          if [ -z "$EMAIL_DIGEST_RECIPIENTS" ] && [ -z "$EMAIL_TO" ] && \
             [ -z "$EMAIL_RECIPIENTS_KS" ] && [ -z "$EMAIL_RECIPIENTS_ALL" ]; then
            echo "WARNING: No recipient secrets configured."
            echo "Set EMAIL_DIGEST_RECIPIENTS or see EMAIL_DIGEST_SETUP.md"
          fi
          echo "Sending email digests at $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.digest }}" ]; then
            echo "Sending single digest: ${{ github.event.inputs.digest }}"
            python src/processing/send_email.py --digest "${{ github.event.inputs.digest }}"
          else
            python src/processing/send_email.py
          fi

      - name: Alert if Open States restore failed
        if: always() && steps.restore-bills.outcome == 'failure'
        env:
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_OPS_ALERT: wesley.a.emberlin@gmail.com
        run: |
          python src/processing/send_email.py --ops-alert --ops-alert-file r2-restore-error.txt
          echo "Open States restore failed; ops alert sent. Digests still ran."
          exit 1
