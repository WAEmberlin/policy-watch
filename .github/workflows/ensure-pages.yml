name: Ensure Pages Deploy

on:
  workflow_run:
    workflows:
      - PolicyWatch Update
      - Open States Sync
      - Daily Legislative Summary
    types:
      - completed
    branches:
      - main
  schedule:
    # Hourly safety net — catches missed deploys between data pushes
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write

concurrency:
  group: ensure-pages-deploy
  cancel-in-progress: false

jobs:
  ensure:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for automatic Pages workflow
        if: github.event_name == 'workflow_run'
        run: sleep 90

      - name: Ensure latest main is live on GitHub Pages
        uses: actions/github-script@v7
        with:
          # Retry transient GitHub API outages (502/503/504) instead of failing the job.
          retries: 6
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pollSeconds = 30;
            const maxTriggerCycles = 5;
            // Cancelled/superseded deploys often leave pages/builds stuck on
            // "building"; treat those as dead after this age.
            const stuckBuildingMinutes = 12;
            // Actions can sit forever in "queued" while Pages API says
            // "building"; treat long-queued runs as dead so we can re-trigger.
            const stuckQueuedMinutes = 12;

            const sleep = (seconds) =>
              new Promise((resolve) => setTimeout(resolve, seconds * 1000));

            function isTransientApiError(error) {
              const status = error?.status ?? error?.response?.status;
              return [429, 500, 502, 503, 504].includes(status);
            }

            async function withApiRetry(label, fn, attempts = 6) {
              let lastError;
              for (let attempt = 1; attempt <= attempts; attempt++) {
                try {
                  return await fn();
                } catch (error) {
                  lastError = error;
                  if (!isTransientApiError(error) || attempt === attempts) {
                    throw error;
                  }
                  const waitSeconds = Math.min(60, 5 * attempt);
                  core.warning(
                    `${label} hit transient API ${error.status || "error"} (attempt ${attempt}/${attempts}); retrying in ${waitSeconds}s`
                  );
                  await sleep(waitSeconds);
                }
              }
              throw lastError;
            }

            async function getMainHead() {
              return withApiRetry("getMainHead", async () => {
                const { data: ref } = await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: "heads/main",
                });
                return ref.object.sha;
              });
            }

            async function getLatestBuild() {
              return withApiRetry("getLatestBuild", async () => {
                const { data } = await github.request(
                  "GET /repos/{owner}/{repo}/pages/builds",
                  {
                    owner,
                    repo,
                    headers: { Accept: "application/vnd.github+json" },
                    per_page: 5,
                  }
                );
                return data[0] || null;
              });
            }

            async function getPagesDeployRuns(headSha) {
              return withApiRetry("getPagesDeployRuns", async () => {
                const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                  owner,
                  repo,
                  branch: "main",
                  per_page: 30,
                });
                return (data.workflow_runs || []).filter((run) => {
                  if (run.head_sha !== headSha) return false;
                  const path = (run.path || "").toLowerCase();
                  return path.includes("pages-build-deployment");
                });
              });
            }

            function isSoftQueuedStatus(status) {
              return ["queued", "waiting", "requested", "pending"].includes(status);
            }

            function isInProgressRun(run) {
              return run.status === "in_progress" || isSoftQueuedStatus(run.status);
            }

            function runCreatedAgeMs(run) {
              const createdMs = Date.parse(run.created_at);
              if (Number.isNaN(createdMs)) return 0;
              return Date.now() - createdMs;
            }

            // Long-queued with no runner pickup — not a healthy deploy in progress.
            function isRunStuckQueued(run) {
              if (!isSoftQueuedStatus(run.status)) return false;
              return runCreatedAgeMs(run) > stuckQueuedMinutes * 60 * 1000;
            }

            // Wait/no-retrigger only for active runs or recently queued ones.
            // Stuck-queued must not block the stuck-building escape or re-trigger.
            function isHealthyInProgressRun(run) {
              if (run.status === "in_progress") return true;
              if (isSoftQueuedStatus(run.status)) return !isRunStuckQueued(run);
              return false;
            }

            function isBuildStuck(build) {
              if (!build || build.status !== "building" || !build.created_at) {
                return false;
              }
              const createdMs = Date.parse(build.created_at);
              if (Number.isNaN(createdMs)) return false;
              return Date.now() - createdMs > stuckBuildingMinutes * 60 * 1000;
            }

            async function isPagesLive(headSha) {
              const build = await getLatestBuild();
              if (build?.commit === headSha && build.status === "built") {
                return true;
              }
              const runs = await getPagesDeployRuns(headSha);
              return runs.some(
                (run) => run.status === "completed" && run.conclusion === "success"
              );
            }

            async function triggerBuild() {
              core.info("Triggering GitHub Pages rebuild...");
              // Extra application-level retries beyond octokit's request retries.
              // Persistent 503s should soft-fail at the call site so cycles continue.
              await withApiRetry("triggerBuild", async () => {
                await github.request("POST /repos/{owner}/{repo}/pages/builds", {
                  owner,
                  repo,
                  headers: { Accept: "application/vnd.github+json" },
                });
              });
            }

            async function waitForDeploy(resolveHeadSha, maxPolls = 20) {
              for (let poll = 1; poll <= maxPolls; poll++) {
                const headSha =
                  typeof resolveHeadSha === "function"
                    ? await resolveHeadSha()
                    : resolveHeadSha;

                if (await isPagesLive(headSha)) {
                  return true;
                }

                const build = await getLatestBuild();
                const runs = await getPagesDeployRuns(headSha);
                const healthyInProgress = runs.filter(isHealthyInProgressRun);
                const stuckQueued = runs.filter(isRunStuckQueued);
                const latestRun = runs[0];

                core.info(
                  `Poll ${poll}/${maxPolls}: pages=${build?.status || "none"}@${(
                    build?.commit || ""
                  ).slice(0, 7)}, actions=${latestRun?.status || "none"}/${
                    latestRun?.conclusion || "-"
                  }, healthy_in_progress=${healthyInProgress.length}, stuck_queued=${
                    stuckQueued.length
                  }`
                );

                if (
                  !healthyInProgress.length &&
                  build?.commit === headSha &&
                  build.status === "errored"
                ) {
                  const message = build.error?.message || "Page build failed.";
                  core.warning(
                    `Pages build errored for ${headSha.slice(0, 7)}: ${message}`
                  );
                  return false;
                }

                if (
                  !healthyInProgress.length &&
                  runs.length &&
                  runs.every(
                    (run) =>
                      run.status === "completed" && run.conclusion !== "success"
                  )
                ) {
                  // Superseded SHA: main tip moved; caller will retarget.
                  const current = await getMainHead();
                  if (current !== headSha) {
                    core.info(
                      `pages-build-deployment ended ${latestRun.conclusion} for superseded ${headSha.slice(
                        0,
                        7
                      )}; main is now ${current.slice(0, 7)}`
                    );
                    return false;
                  }
                  core.warning(
                    `pages-build-deployment ended ${latestRun.conclusion} for ${headSha.slice(
                      0,
                      7
                    )} (often Deployment cancelled from a race)`
                  );
                  return false;
                }

                if (
                  !healthyInProgress.length &&
                  stuckQueued.length &&
                  runs.every(
                    (run) =>
                      run.status === "completed" || isRunStuckQueued(run)
                  )
                ) {
                  core.warning(
                    `pages-build-deployment stuck queued since ${stuckQueued[0].created_at}; ending wait cycle`
                  );
                  return false;
                }

                if (
                  !healthyInProgress.length &&
                  build?.commit === headSha &&
                  isBuildStuck(build)
                ) {
                  core.warning(
                    `Pages API stuck in building since ${build.created_at}; ending wait cycle`
                  );
                  return false;
                }

                await sleep(pollSeconds);
              }
              return false;
            }

            let headSha = await getMainHead();
            core.info(`main HEAD: ${headSha}`);

            // POST /pages/builds always targets current main tip. If main moves
            // (e.g. PolicyWatch Update lands mid-ensure), retarget or we wait
            // forever on cancelled runs for a superseded SHA.
            async function refreshHeadSha() {
              const current = await getMainHead();
              if (current !== headSha) {
                core.info(
                  `main advanced ${headSha.slice(0, 7)} → ${current.slice(
                    0,
                    7
                  )}; retargeting`
                );
                headSha = current;
              }
              return headSha;
            }

            if (await isPagesLive(headSha)) {
              core.info("Pages already serving latest main commit.");
              return;
            }

            for (let cycle = 1; cycle <= maxTriggerCycles; cycle++) {
              await refreshHeadSha();
              core.info(`Deploy cycle ${cycle}/${maxTriggerCycles} for ${headSha.slice(0, 7)}`);

              if (await isPagesLive(headSha)) {
                core.info("Pages already serving latest main commit.");
                return;
              }

              const build = await getLatestBuild();
              const runs = await getPagesDeployRuns(headSha);
              const healthyInProgress = runs.some(isHealthyInProgressRun);
              const stuckQueued = runs.some(isRunStuckQueued);
              const stuckBuild =
                build?.commit === headSha && isBuildStuck(build);
              const stuck = stuckBuild || stuckQueued;
              // Pages API can stay "building" after Actions already failed/cancelled
              // (queued runner never started). Do not wait — re-trigger.
              const actionsAlreadyFailed =
                !healthyInProgress &&
                !stuckQueued &&
                runs.length > 0 &&
                runs.every(
                  (run) =>
                    run.status === "completed" && run.conclusion !== "success"
                );

              if (healthyInProgress) {
                core.info(
                  "pages-build-deployment already in progress for latest commit; waiting (no re-trigger)."
                );
              } else if (
                build?.commit === headSha &&
                build.status === "building" &&
                !stuck &&
                !actionsAlreadyFailed
              ) {
                core.info(
                  "Pages API reports building for latest commit; waiting (no re-trigger)."
                );
              } else {
                if (stuckQueued) {
                  const oldestQueued = runs.find(isRunStuckQueued);
                  core.warning(
                    `pages-build-deployment stuck queued since ${oldestQueued?.created_at}; re-triggering.`
                  );
                } else if (stuckBuild) {
                  core.warning(
                    `Pages build stuck in building since ${build.created_at}; re-triggering.`
                  );
                } else if (actionsAlreadyFailed) {
                  core.warning(
                    `pages-build-deployment already failed/cancelled for ${headSha.slice(
                      0,
                      7
                    )} while Pages API still reports ${build?.status || "none"}; re-triggering.`
                  );
                }
                try {
                  await triggerBuild();
                  await sleep(45);
                } catch (error) {
                  // Do not abort remaining cycles on prolonged Pages API outages.
                  if (isTransientApiError(error)) {
                    core.warning(
                      `POST /pages/builds failed after retries (${error.status || "error"}): ${
                        error.message || error
                      }; continuing to wait/poll`
                    );
                    await sleep(60);
                  } else {
                    throw error;
                  }
                }
              }

              if (await waitForDeploy(() => refreshHeadSha())) {
                core.info("Pages deploy succeeded.");
                return;
              }

              core.warning(
                `Cycle ${cycle} did not reach built state for ${headSha.slice(0, 7)}`
              );
              await sleep(60);
            }

            core.setFailed(
              `Pages deploy did not reach built state for ${headSha.slice(
                0,
                7
              )} after ${maxTriggerCycles} attempts`
            );
