# Rebuild homepage feed artifacts from R2 site_data.json and upload to Cloudflare R2.
# Day files are gitignored; this workflow regenerates them before upload.
name: Upload docs to R2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    # windows-latest: ubuntu-latest hosted runners were stuck queued during Actions outages.
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install boto3

      - name: Rebuild home feeds from R2 site_data and upload docs
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          PYTHONPATH: src
        shell: bash
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_PUBLIC_BASE_URL" ]; then
            echo "ERROR: R2 secrets are required"
            exit 1
          fi
          # Prefer local site_data if present (manual runners); otherwise pull from R2.
          if [ ! -f docs/site_data.json ]; then
            python src/processing/r2_sync.py download site_data.json
          fi
          test -f docs/site_data.json || { echo "ERROR: docs/site_data.json missing"; exit 1; }
          # Full bill/legislator archive lives in normalized (site_data is often stale).
          mkdir -p data/normalized
          python src/processing/r2_sync.py download \
            data/normalized/search_index.json \
            data/normalized/legislators.json \
            data/normalized/legislator_stats.json \
            data/normalized/meta.json
          test -f data/normalized/search_index.json || {
            echo "ERROR: data/normalized/search_index.json missing"
            exit 1
          }
          python src/processing/r2_sync.py rebuild-home-feeds
          python src/processing/r2_sync.py rebuild-legislators-directory
          test -f docs/home_feed.json || { echo "ERROR: docs/home_feed.json missing"; exit 1; }
          test -f docs/home_search_bills.json || { echo "ERROR: docs/home_search_bills.json missing"; exit 1; }
          test -f docs/legislators_directory.json || {
            echo "ERROR: docs/legislators_directory.json missing"
            exit 1
          }
          test -d docs/home_feed_days || { echo "ERROR: docs/home_feed_days/ missing"; exit 1; }
          day_count=$(find docs/home_feed_days -name '*.json' | wc -l)
          python - <<'PY'
          import json
          from pathlib import Path
          feed = json.load(open("docs/home_feed.json", encoding="utf-8"))
          dates = feed.get("available_dates") or []
          assert dates, "home_feed.json missing available_dates"
          search = json.load(open("docs/home_search_bills.json", encoding="utf-8"))
          search_n = len(search.get("bills") or [])
          meta = json.load(open("data/normalized/meta.json", encoding="utf-8"))
          expected = int((meta.get("counts") or {}).get("bills") or 0)
          print(
              f"home_feed available_dates={len(dates)} "
              f"recent={((feed.get('feed_window') or {}).get('dates'))} "
              f"search_bills={search_n} normalized_bills={expected}"
          )
          assert expected > 0, "normalized meta missing bill count"
          assert search_n >= int(expected * 0.90), (
              f"home_search_bills.json too small ({search_n} < 90% of {expected})"
          )
          print(f"home_search size={Path('docs/home_search_bills.json').stat().st_size} bytes")
          leg_dir = json.load(open("docs/legislators_directory.json", encoding="utf-8"))
          leg_n = len(leg_dir.get("legislators") or [])
          assert leg_dir.get("legislators_directory") or leg_n > 0, (
              "legislators_directory.json empty/invalid"
          )
          # Must stay tiny vs site_data (~200MB); directory cards only.
          leg_size = Path("docs/legislators_directory.json").stat().st_size
          assert leg_size < 2_000_000, f"legislators_directory.json too large ({leg_size} bytes)"
          print(f"legislators_directory count={leg_n} size={leg_size} bytes")
          PY
          echo "Uploading home_feed.json, home_search_bills.json, legislators_directory.json, plus ${day_count} day files"
          python src/processing/r2_sync.py upload --docs-only
