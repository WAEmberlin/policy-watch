# Rebuild homepage feed artifacts from R2 site_data.json and upload to Cloudflare R2.
# Day files are gitignored; this workflow regenerates them before upload.
name: Upload docs to R2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    # windows-latest: ubuntu-latest hosted runners were stuck queued during Actions outages.
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install boto3 pyyaml

      - name: Rebuild home feeds from R2 site_data and upload docs
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          PYTHONPATH: src
        shell: bash
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_PUBLIC_BASE_URL" ]; then
            echo "ERROR: R2 secrets are required"
            exit 1
          fi
          # Prefer local site_data if present (manual runners); otherwise pull from R2.
          if [ ! -f docs/site_data.json ]; then
            python src/processing/r2_sync.py download site_data.json
          fi
          test -f docs/site_data.json || { echo "ERROR: docs/site_data.json missing"; exit 1; }
          # Full bill/legislator archive lives in normalized (site_data is often stale).
          mkdir -p data/normalized data/openstates
          python src/processing/r2_sync.py download \
            data/normalized/search_index.json \
            data/normalized/legislators.json \
            data/normalized/legislator_stats.json \
            data/normalized/events.json \
            data/normalized/meta.json \
            data/normalized/bills.json
          test -f data/normalized/search_index.json || {
            echo "ERROR: data/normalized/search_index.json missing"
            exit 1
          }
          # Roll-call voter arrays live in openstates caches (normalized votes are slimmed).
          for st in ks co az ut me ne md pa ma wv tn nc mo ia; do
            python src/processing/r2_sync.py download "data/openstates/${st}/votes.json" \
              || echo "WARN: missing openstates votes for ${st}"
          done
          python src/processing/r2_sync.py rebuild-home-feeds
          python src/processing/r2_sync.py rebuild-legislators-directory
          python src/processing/r2_sync.py rebuild-hearings-feed
          # Vote docs + bill lookups from openstates/normalized — never site_data.
          python src/processing/r2_sync.py rebuild-vote-docs
          test -f docs/home_feed.json || { echo "ERROR: docs/home_feed.json missing"; exit 1; }
          test -f docs/home_search_bills.json || { echo "ERROR: docs/home_search_bills.json missing"; exit 1; }
          test -f docs/legislators_directory.json || {
            echo "ERROR: docs/legislators_directory.json missing"
            exit 1
          }
          test -f docs/hearings.json || {
            echo "ERROR: docs/hearings.json missing"
            exit 1
          }
          test -f docs/legislator_vote_counts.json || {
            echo "ERROR: docs/legislator_vote_counts.json missing"
            exit 1
          }
          test -f docs/legislator_votes.json || {
            echo "ERROR: docs/legislator_votes.json missing"
            exit 1
          }
          test -f docs/bill_title_lookup.json || {
            echo "ERROR: docs/bill_title_lookup.json missing"
            exit 1
          }
          test -d docs/home_feed_days || { echo "ERROR: docs/home_feed_days/ missing"; exit 1; }
          day_count=$(find docs/home_feed_days -name '*.json' | wc -l)
          python - <<'PY'
          import json
          from pathlib import Path
          from processing.vote_docs import vote_counts_by_state

          feed = json.load(open("docs/home_feed.json", encoding="utf-8"))
          dates = feed.get("available_dates") or []
          assert dates, "home_feed.json missing available_dates"
          search = json.load(open("docs/home_search_bills.json", encoding="utf-8"))
          search_n = len(search.get("bills") or [])
          meta = json.load(open("data/normalized/meta.json", encoding="utf-8"))
          expected = int((meta.get("counts") or {}).get("bills") or 0)
          print(
              f"home_feed available_dates={len(dates)} "
              f"recent={((feed.get('feed_window') or {}).get('dates'))} "
              f"search_bills={search_n} normalized_bills={expected}"
          )
          assert expected > 0, "normalized meta missing bill count"
          shortfall = expected - search_n
          assert search_n >= int(expected * 0.90) and shortfall <= 10000, (
              f"home_search_bills.json too small "
              f"({search_n}; need >=90% of {expected} and shortfall<=10000)"
          )
          print(f"home_search size={Path('docs/home_search_bills.json').stat().st_size} bytes")
          leg_dir = json.load(open("docs/legislators_directory.json", encoding="utf-8"))
          leg_n = len(leg_dir.get("legislators") or [])
          assert leg_dir.get("legislators_directory") or leg_n > 0, (
              "legislators_directory.json empty/invalid"
          )
          # Must stay tiny vs site_data (~200MB); directory cards only.
          leg_size = Path("docs/legislators_directory.json").stat().st_size
          assert leg_size < 2_000_000, f"legislators_directory.json too large ({leg_size} bytes)"
          print(f"legislators_directory count={leg_n} size={leg_size} bytes")
          hearings = json.load(open("docs/hearings.json", encoding="utf-8"))
          assert hearings.get("hearings_feed") or isinstance(hearings.get("upcoming_hearings"), list), (
              "hearings.json empty/invalid"
          )
          h_states = hearings.get("states") or []
          assert len(h_states) >= 7, f"hearings.json states too short ({len(h_states)})"
          h_size = Path("docs/hearings.json").stat().st_size
          assert h_size < 20_000_000, f"hearings.json too large ({h_size} bytes)"
          print(
              f"hearings upcoming={len(hearings.get('upcoming_hearings') or [])} "
              f"historical={len(hearings.get('historical_hearings') or [])} "
              f"states={len(h_states)} size={h_size} bytes"
          )

          counts = json.load(open("docs/legislator_vote_counts.json", encoding="utf-8"))
          legs = {
              row["id"]: row
              for row in json.load(open("data/normalized/legislators.json", encoding="utf-8"))
              if isinstance(row, dict) and row.get("id")
          }
          fake_votes = {lid: [None] * n for lid, n in counts.items() if n}
          by_state = vote_counts_by_state(fake_votes, list(legs.values()))
          print(f"legislator_vote_counts by state: {by_state}")
          assert len(by_state) >= 8, (
              f"vote counts cover too few states ({by_state}); "
              "expected openstates votes for PA/MA/etc."
          )
          titles = json.load(open("docs/bill_title_lookup.json", encoding="utf-8"))
          title_states = sorted({k.split(":", 1)[0] for k in titles})
          print(f"bill_title_lookup keys={len(titles)} states={title_states}")
          assert len(titles) > 10000, f"bill_title_lookup too small ({len(titles)})"
          PY
          echo "Uploading home_feed, legislators_directory, hearings, vote docs, bill lookups, plus ${day_count} day files"
          python src/processing/r2_sync.py upload --docs-only
