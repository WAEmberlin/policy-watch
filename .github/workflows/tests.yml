name: CivicWatch Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit and integration tests
        run: pytest tests/ -v --cov=src --cov-report=term-missing --tb=short

      - name: Validate config
        run: python -c "import yaml; yaml.safe_load(open('config/states.yaml'))"

      - name: Validate normalization (offline)
        run: python src/processing/normalize_data.py --skip-ai
