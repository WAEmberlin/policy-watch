name: Open States Sync

on:
  schedule:
    # 6:30 PM Central (CST) = 00:30 UTC
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Backfill states missing data from 2026-03-01 (skips already-complete states)"
        required: false
        default: "false"
        type: boolean
      since_date:
        description: "Optional YYYY-MM-DD override for updated_since filter"
        required: false
        default: ""
        type: string
      states:
        description: "Comma-separated state codes only (e.g. me,ut) — saves API quota"
        required: false
        default: ""
        type: string
      force:
        description: "Re-fetch even if recently synced"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore pipeline caches from R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_ACCESS_KEY_ID" ]; then
            python src/processing/r2_sync.py download-pipeline || echo "R2 pipeline restore skipped/failed, continuing"
          else
            echo "R2 secrets not set; skipping pipeline restore"
          fi

      - name: Import Open States bulk historical data
        run: python src/processing/import_openstates_bulk.py || echo "No bulk exports found, skipping"

      - name: Fetch Open States data
        env:
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.full_refresh }}" = "true" ]; then
            ARGS="--full-refresh"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -n "${{ github.event.inputs.since_date }}" ]; then
            ARGS="$ARGS --since ${{ github.event.inputs.since_date }}"
          fi
          if [ -n "${{ github.event.inputs.states }}" ]; then
            ARGS="$ARGS --states ${{ github.event.inputs.states }}"
          fi
          if [ -n "$OPENSTATES_API_KEY" ]; then
            python src/processing/fetch_openstates.py $ARGS
          else
            echo "OPENSTATES_API_KEY not set, skipping Open States fetch"
          fi

      - name: Enrich state data (Kansas API + Open States detail)
        # Non-blocking: a successful Open States fetch should still normalize/commit
        # even if detail enrichment hits API/memory issues on large state caches.
        continue-on-error: true
        env:
          KANSAS_LEGISLATURE_API_KEY: ${{ secrets.KANSAS_LEGISLATURE_API_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
        run: python src/processing/enrich_all_states.py

      - name: Normalize data from all sources
        run: python src/processing/normalize_data.py --skip-ai

      - name: Generate AI enrichments
        run: python src/processing/normalize_data.py

      - name: Generate weekly digests
        run: python src/processing/generate_digests.py

      - name: Run existing fetch pipeline (preserve Congress + Kansas)
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          KANSAS_LEGISLATURE_API_KEY: ${{ secrets.KANSAS_LEGISLATURE_API_KEY }}
        run: |
          python src/processing/fetch_feeds.py
          python src/processing/fetch_kansas_rss.py
          python src/processing/fetch_kansas_calendar.py
          YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }} python src/processing/fetch_youtube_live.py
          python src/processing/fetch_kansas_hearings.py
          if [ -n "$CONGRESS_API_KEY" ]; then
            python src/processing/fetch_congress_api.py
            python src/processing/fetch_hearings.py || echo "Hearings fetch failed, continuing..."
          fi

      - name: Build site data
        run: python src/processing/summarize.py

      - name: Upload generated data to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_PUBLIC_BASE_URL" ]; then
            echo "ERROR: R2 secrets are required"
            exit 1
          fi
          python src/processing/r2_sync.py upload

      # Unit tests live in CivicWatch Tests (tests.yml) on push/PR.
      # Do not run pytest here — a flaky/stale unit test must not fail data delivery.

      - name: Commit updated data
        run: |
          git config user.name "civicwatch-bot"
          git config user.email "actions@github.com"
          git fetch origin main
          # Only commit small pipeline outputs — large JSON lives on Cloudflare R2.
          GENERATED="docs/data-config.js docs/live_status.json docs/live-streams-config.json docs/weekly data/kansas data/arizona data/utah data/normalized/meta.json data/normalized/events.json data/normalized/legislators.json data/normalized/legislator_stats.json data/normalized/dashboards.json src/output"

          restore_static_docs() {
            git ls-tree -r --name-only origin/main docs/ | while IFS= read -r f; do
              case "$f" in
                docs/data-config.js|docs/live_status.json|docs/live-streams-config.json) continue ;;
              esac
              [[ "$f" == docs/weekly/* ]] && continue
              git checkout origin/main -- "$f"
            done
          }

          drop_oversized() {
            MAX_BYTES=$((95 * 1024 * 1024))
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              [ -f "$f" ] || continue
              size=$(wc -c < "$f")
              if [ "$size" -gt "$MAX_BYTES" ]; then
                echo "ERROR: $f is $size bytes (limit ${MAX_BYTES}) — should be on R2, not git"
                git reset HEAD -- "$f" || true
              fi
            done < <(git diff --cached --name-only --diff-filter=ACMR)
          }

          # Mixed reset (not --soft): keep pipeline outputs in the working tree, but
          # sync the index to origin/main so a concurrent workflow/.github commit is
          # never reverted — GITHUB_TOKEN cannot push workflow file changes.
          rebuild_commit() {
            git fetch origin main
            git reset origin/main
            restore_static_docs
            git checkout origin/main -- .github || true
            git add -f $GENERATED
            drop_oversized
            git reset HEAD -- .github 2>/dev/null || true
            if git diff --cached --name-only | grep -E '^\.github/'; then
              echo "ERROR: refusing to commit .github paths"
              git diff --cached --name-only | grep -E '^\.github/' || true
              git reset HEAD -- .github
            fi
            if git diff --cached --quiet; then
              echo "No changes to commit"
              return 1
            fi
            git commit -m "Open States sync and normalized data update"
            return 0
          }

          if ! rebuild_commit; then
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push rejected, rebuilding commit from origin/main ($attempt/5)..."
            rebuild_commit || exit 0
            sleep $((attempt * 15))
          done
          echo "Failed to push after 5 attempts"
          exit 1
