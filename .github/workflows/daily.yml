name: PolicyWatch Update

on:
  schedule:
    - cron: "30 * * * *"  # Every hour at :30 UTC
  workflow_dispatch:

concurrency:
  group: policywatch-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install feedparser pyyaml requests beautifulsoup4 boto3

      - name: Restore pipeline caches from R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_ACCESS_KEY_ID" ]; then
            python src/processing/r2_sync.py download-pipeline || echo "R2 pipeline restore skipped/failed, continuing"
          else
            echo "R2 secrets not set; skipping pipeline restore"
          fi

      - name: Fetch feeds
        run: python src/processing/fetch_feeds.py

      - name: Fetch Kansas Legislature RSS feeds
        run: python src/processing/fetch_kansas_rss.py

      - name: Fetch Arizona bills (Cactus Watch API)
        run: python src/processing/fetch_arizona_cactus.py

      - name: Fetch Utah committee RSS hearings
        run: python src/processing/fetch_utah_committee_rss.py

      - name: Fetch Kansas Legislature calendars
        run: python src/processing/fetch_kansas_calendar.py

      - name: Enrich Kansas bills (official REST API)
        env:
          KANSAS_LEGISLATURE_API_KEY: ${{ secrets.KANSAS_LEGISLATURE_API_KEY }}
        run: python src/processing/enrich_kansas_api.py

      - name: Fetch Kansas roll-call vote details
        env:
          KANSAS_LEGISLATURE_API_KEY: ${{ secrets.KANSAS_LEGISLATURE_API_KEY }}
        run: python src/processing/fetch_kansas_vote_details.py

      - name: Fetch Congress API legislation
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: |
          if [ -n "$CONGRESS_API_KEY" ]; then
            python src/processing/fetch_congress_api.py
          else
            echo "CONGRESS_API_KEY not set, skipping Congress API fetch"
          fi

      - name: Fetch Congressional hearings
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: |
          if [ -n "$CONGRESS_API_KEY" ]; then
            python src/processing/fetch_hearings.py || echo "Hearings fetch failed, continuing..."
          else
            echo "CONGRESS_API_KEY not set, skipping hearings fetch"
          fi

      - name: Import Open States bulk historical data
        run: python src/processing/import_openstates_bulk.py || echo "No bulk exports found, skipping"

      - name: Normalize and merge enrichments
        run: python src/processing/normalize_data.py --skip-ai

      - name: Build HTML digest
        run: python src/processing/summarize.py

      - name: Generate weekly overview (Fridays at 11pm Central, or if >6 days old)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          # Generate weekly overview on:
          # 1. Manual trigger (workflow_dispatch) - always generate
          # 2. Fridays at 11pm Central (Saturday 4-6am UTC)
          # 3. OR if last summary is more than 6 days old (catch-up)
          
          # Check if this is a manual trigger
          IS_MANUAL_TRIGGER=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IS_MANUAL_TRIGGER=true
            echo "Manual trigger detected - will generate weekly overview"
          fi
          
          CURRENT_DAY=$(date -u +%u)  # 1=Monday, 6=Saturday
          CURRENT_HOUR=$(date -u +%H)
          CURRENT_HOUR_NUM=$((10#$CURRENT_HOUR))  # Convert to number for comparison
          
          # Check if it's the scheduled time (Saturday 4-6am UTC = Friday 11pm Central)
          IS_SCHEDULED_TIME=false
          if [ "$CURRENT_DAY" = "6" ] && [ $CURRENT_HOUR_NUM -ge 4 ] && [ $CURRENT_HOUR_NUM -le 6 ]; then
            IS_SCHEDULED_TIME=true
            echo "Scheduled time detected: Friday 11pm Central / Saturday $CURRENT_HOUR:00 UTC"
          fi
          
          # Check if last summary is more than 5 days old (weekly = 7 days, so 5+ means overdue)
          NEEDS_UPDATE=false
          if [ -f "docs/weekly/latest.json" ]; then
            LAST_GENERATED=$(python3 -c "import json, sys; data=json.load(open('docs/weekly/latest.json')); print(data.get('generated_at', ''))" 2>/dev/null || echo "")
            if [ -n "$LAST_GENERATED" ]; then
              DAYS_OLD=$(python3 -c "from datetime import datetime, timezone; last=datetime.fromisoformat('$LAST_GENERATED'.replace('Z', '+00:00')); now=datetime.now(timezone.utc); print(int((now-last).total_seconds()/86400))" 2>/dev/null || echo "0")
              if [ "$DAYS_OLD" -ge 5 ]; then
                NEEDS_UPDATE=true
                echo "Last summary is $DAYS_OLD days old (threshold: 5 days) - generating update"
              else
                echo "Last summary is $DAYS_OLD days old - within threshold (will wait for scheduled time)"
              fi
            else
              echo "Could not parse last generation date - will generate to be safe"
              NEEDS_UPDATE=true
            fi
          else
            echo "No existing weekly summary found - will generate"
            NEEDS_UPDATE=true
          fi
          
          if [ "$IS_MANUAL_TRIGGER" = "true" ] || [ "$IS_SCHEDULED_TIME" = "true" ] || [ "$NEEDS_UPDATE" = "true" ]; then
            echo "Generating weekly overview..."
            # Debug: Check if secret is set (without exposing it)
            if [ -z "$ELEVENLABS_API_KEY" ]; then
              echo "Warning: ELEVENLABS_API_KEY secret is not set or empty"
            else
              echo "ELEVENLABS_API_KEY is set (length: ${#ELEVENLABS_API_KEY} characters)"
            fi
            python -m src.processing.weekly_overview || echo "Weekly overview generation failed, continuing..."
          else
            echo "Skipping weekly overview (not scheduled time and summary is recent)"
            echo "Current day: $CURRENT_DAY, Current hour: $CURRENT_HOUR"
          fi

      - name: Upload generated data to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_PUBLIC_BASE_URL" ]; then
            echo "ERROR: R2 secrets are required (R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_PUBLIC_BASE_URL, ...)"
            exit 1
          fi
          python src/processing/r2_sync.py upload

      # Note: Daily email is now handled by separate workflow (.github/workflows/daily_email.yml
      # This keeps email sending independent from site updates

      - name: Commit updated site
        run: |
          git config user.name "policywatch-bot"
          git config user.email "actions@github.com"
          git fetch origin main
          # Only commit small pipeline outputs — large JSON lives on Cloudflare R2.
          # Never git-add docs/site_data.json or data/normalized bulk files.
          GENERATED="docs/data-config.js docs/home_feed.json docs/legislators_directory.json docs/hearings.json docs/weekly src/output data/kansas data/arizona data/utah data/normalized/meta.json data/normalized/events.json data/normalized/legislators.json data/normalized/legislator_stats.json data/normalized/dashboards.json"

          restore_static_docs() {
            git ls-tree -r --name-only origin/main docs/ | while IFS= read -r f; do
              case "$f" in
                docs/data-config.js|docs/home_feed.json|docs/legislators_directory.json|docs/hearings.json) continue ;;
              esac
              [[ "$f" == docs/weekly/* ]] && continue
              git checkout origin/main -- "$f"
            done
          }

          # Mixed reset (not --soft): keep pipeline outputs in the working tree, but
          # sync the index to origin/main so a concurrent workflow/.github commit is
          # never reverted — GITHUB_TOKEN cannot push workflow file changes.
          rebuild_commit() {
            git fetch origin main
            git reset origin/main
            restore_static_docs
            git checkout origin/main -- data/openstates .github || true
            git add -f $GENERATED
            git reset HEAD -- .github 2>/dev/null || true
            if git diff --cached --name-only | grep -E '^\.github/'; then
              echo "ERROR: refusing to commit .github paths"
              git diff --cached --name-only | grep -E '^\.github/' || true
              git reset HEAD -- .github
            fi
            if git diff --cached --quiet; then
              echo "No changes to commit"
              return 1
            fi
            git commit -m "Automated PolicyWatch Update"
            return 0
          }

          if ! rebuild_commit; then
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              exit 0
            fi
            echo "Push rejected, rebuilding commit from origin/main ($attempt/5)..."
            rebuild_commit || exit 0
            sleep $((attempt * 15))
          done
          exit 1
